<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200"><title>Burgundy Cube</title><style>
.breathe{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 4.2s ease-in-out -0.6s infinite}
.blink{transform-box:fill-box;transform-origin:50% 50%;animation:blink 6s ease-in-out 0.7s infinite}
.sway{transform-box:fill-box;transform-origin:50% 0;animation:sway 3.6s ease-in-out -0.5s infinite}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.02,.975)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96.5%{transform:scaleY(.1)}}
@keyframes sway{0%,100%{rotate:-4deg}50%{rotate:4deg}}
@media (prefers-reduced-motion:reduce){.breathe,.blink,.sway{animation:none}}
</style><g class="breathe"><rect x="34" y="44" width="132" height="128" rx="40" fill="#8e1733"/><ellipse cx="74" cy="72" rx="24" ry="12" fill="#fff" opacity=".22"/><g class="blink"><ellipse cx="80" cy="104" rx="6.5" ry="9" fill="#1b1b1b"/><circle cx="82" cy="100.5" r="2" fill="#fff"/><ellipse cx="120" cy="104" rx="6.5" ry="9" fill="#1b1b1b"/><circle cx="122" cy="100.5" r="2" fill="#fff"/></g><g class="sway" transform="rotate(-14 66 44)"><path d="M46 52l4-26 12 14 8-18 8 18 12-14 4 26z" fill="#e6b33c" stroke="#c8941f" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="50" cy="25" r="4" fill="#f2c95a"/><circle cx="70" cy="21" r="4" fill="#f2c95a"/><circle cx="90" cy="25" r="4" fill="#f2c95a"/></g></g></svg>
