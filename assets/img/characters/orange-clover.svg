<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200"><title>Orange Clover</title><style>
.breathe{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 4.2s ease-in-out -1.7999999999999998s infinite}
.blink{transform-box:fill-box;transform-origin:50% 50%;animation:blink 7s ease-in-out 0s infinite}
.sway{transform-box:fill-box;transform-origin:50% 0;animation:sway 3.6s ease-in-out -2s infinite}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.02,.975)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96.5%{transform:scaleY(.1)}}
@keyframes sway{0%,100%{rotate:-4deg}50%{rotate:4deg}}
@media (prefers-reduced-motion:reduce){.breathe,.blink,.sway{animation:none}}
</style><g class="breathe"><circle cx="70" cy="82" r="40" fill="#e5612b"/><circle cx="130" cy="82" r="40" fill="#e5612b"/><circle cx="70" cy="136" r="40" fill="#e5612b"/><circle cx="130" cy="136" r="40" fill="#e5612b"/><rect x="60" y="72" width="80" height="74" fill="#e5612b"/><ellipse cx="64" cy="70" rx="18" ry="10" fill="#fff" opacity=".22"/><g class="blink"><ellipse cx="82" cy="100" rx="6.5" ry="9" fill="#1b1b1b"/><circle cx="84" cy="96.5" r="2" fill="#fff"/><ellipse cx="118" cy="100" rx="6.5" ry="9" fill="#1b1b1b"/><circle cx="120" cy="96.5" r="2" fill="#fff"/></g><path d="M36 118L144 150" stroke="#1b1b1b" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/><g class="sway"><rect x="108" y="132" width="52" height="34" rx="12" fill="#1b1b1b" transform="rotate(-24 134 149)"/><rect x="116" y="140" width="22" height="6" rx="3" fill="#3a3a3a" transform="rotate(-24 127 143)"/></g></g></svg>
