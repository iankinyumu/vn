<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200"><title>Violet Binoculars</title><style>
.breathe{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 4.2s ease-in-out -2.4s infinite}
.blink{transform-box:fill-box;transform-origin:50% 50%;animation:blink 7s ease-in-out 2.0999999999999996s infinite}
.sway{transform-box:fill-box;transform-origin:50% 0;animation:sway 3.6s ease-in-out 0s infinite}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.02,.975)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96.5%{transform:scaleY(.1)}}
@keyframes sway{0%,100%{rotate:-4deg}50%{rotate:4deg}}
@media (prefers-reduced-motion:reduce){.breathe,.blink,.sway{animation:none}}
</style><g class="breathe"><path d="M100 172C46 136 26 104 40 72 52 46 88 44 100 70 112 44 148 46 160 72 174 104 154 136 100 172Z" fill="#a67bef" stroke="#a67bef" stroke-width="16" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="66" cy="72" rx="18" ry="10" fill="#fff" opacity=".22"/><g class="blink"><ellipse cx="78" cy="104" rx="6.5" ry="9" fill="#1b1b1b"/><circle cx="80" cy="100.5" r="2" fill="#fff"/></g><path d="M113 106q9 -9 18 0" fill="none" stroke="#1b1b1b" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><g class="sway"><rect x="74" y="136" width="22" height="32" rx="7" fill="#262626"/><rect x="104" y="136" width="22" height="32" rx="7" fill="#262626"/><rect x="92" y="144" width="16" height="10" rx="3" fill="#1a1a1a"/><circle cx="85" cy="166" r="7" fill="#111" stroke="#4a4a4a" stroke-width="2"/><circle cx="115" cy="166" r="7" fill="#111" stroke="#4a4a4a" stroke-width="2"/></g></g></svg>
