<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200"><title>Turquoise Bandana</title><style>
.breathe{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 4.2s ease-in-out -1.7999999999999998s infinite}
.blink{transform-box:fill-box;transform-origin:50% 50%;animation:blink 6s ease-in-out 1.4s infinite}
.sway{transform-box:fill-box;transform-origin:50% 0;animation:sway 3.6s ease-in-out -2.5s infinite}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.02,.975)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96.5%{transform:scaleY(.1)}}
@keyframes sway{0%,100%{rotate:-4deg}50%{rotate:4deg}}
@media (prefers-reduced-motion:reduce){.breathe,.blink,.sway{animation:none}}
</style><g class="breathe"><polygon points="100,52 168,162 32,162" fill="#4fd0c4" stroke="#4fd0c4" stroke-width="34" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="90" cy="104" rx="14" ry="9" fill="#fff" opacity=".22"/><g class="blink"><ellipse cx="84" cy="134" rx="6.5" ry="9" fill="#1b1b1b"/><circle cx="86" cy="130.5" r="2" fill="#fff"/><ellipse cx="116" cy="134" rx="6.5" ry="9" fill="#1b1b1b"/><circle cx="118" cy="130.5" r="2" fill="#fff"/></g><path d="M64 92q36 -8 72 0l4 16q-40 -8 -80 0z" fill="#1b1b1b"/><g class="sway" transform="translate(62 98)"><path d="M0 0l-34 -20 6 22z" fill="#262626"/><path d="M0 2l-30 14 4 -20z" fill="#1b1b1b"/></g></g></svg>
