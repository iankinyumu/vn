<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200"><title>Rose Pearls</title><style>
.breathe{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 4.2s ease-in-out -0.6s infinite}
.blink{transform-box:fill-box;transform-origin:50% 50%;animation:blink 8s ease-in-out 0s infinite}
.sway{transform-box:fill-box;transform-origin:50% 0;animation:sway 3.6s ease-in-out -1.5s infinite}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.02,.975)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96.5%{transform:scaleY(.1)}}
@keyframes sway{0%,100%{rotate:-4deg}50%{rotate:4deg}}
@media (prefers-reduced-motion:reduce){.breathe,.blink,.sway{animation:none}}
</style><g class="breathe"><ellipse cx="100" cy="110" rx="70" ry="66" fill="#f6a7bc"/><ellipse cx="76" cy="76" rx="22" ry="12" fill="#fff" opacity=".22"/><g class="blink"><ellipse cx="82" cy="104" rx="6.5" ry="9" fill="#1b1b1b"/><circle cx="84" cy="100.5" r="2" fill="#fff"/><ellipse cx="118" cy="104" rx="6.5" ry="9" fill="#1b1b1b"/><circle cx="120" cy="100.5" r="2" fill="#fff"/></g><circle cx="34.0" cy="140.0" r="6" fill="#f7f2e7" stroke="#d9cfbb" stroke-width="1.2"/><circle cx="43.4" cy="144.0" r="6" fill="#f7f2e7" stroke="#d9cfbb" stroke-width="1.2"/><circle cx="52.9" cy="147.8" r="6" fill="#f7f2e7" stroke="#d9cfbb" stroke-width="1.2"/><circle cx="62.3" cy="151.2" r="6" fill="#f7f2e7" stroke="#d9cfbb" stroke-width="1.2"/><circle cx="71.7" cy="154.1" r="6" fill="#f7f2e7" stroke="#d9cfbb" stroke-width="1.2"/><circle cx="81.1" cy="156.2" r="6" fill="#f7f2e7" stroke="#d9cfbb" stroke-width="1.2"/><circle cx="90.6" cy="157.5" r="6" fill="#f7f2e7" stroke="#d9cfbb" stroke-width="1.2"/><circle cx="100.0" cy="158.0" r="6" fill="#f7f2e7" stroke="#d9cfbb" stroke-width="1.2"/><circle cx="109.4" cy="157.5" r="6" fill="#f7f2e7" stroke="#d9cfbb" stroke-width="1.2"/><circle cx="118.9" cy="156.2" r="6" fill="#f7f2e7" stroke="#d9cfbb" stroke-width="1.2"/><circle cx="128.3" cy="154.1" r="6" fill="#f7f2e7" stroke="#d9cfbb" stroke-width="1.2"/><circle cx="137.7" cy="151.2" r="6" fill="#f7f2e7" stroke="#d9cfbb" stroke-width="1.2"/><circle cx="147.1" cy="147.8" r="6" fill="#f7f2e7" stroke="#d9cfbb" stroke-width="1.2"/><circle cx="156.6" cy="144.0" r="6" fill="#f7f2e7" stroke="#d9cfbb" stroke-width="1.2"/><circle cx="166.0" cy="140.0" r="6" fill="#f7f2e7" stroke="#d9cfbb" stroke-width="1.2"/></g></svg>
