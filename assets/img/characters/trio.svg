="100" cy="128" r="40" fill="#a7d889"/><ellipse cx="80" cy="104" rx="20" ry="10" fill="#fff" opacity=".22"/><g class="blink"><ellipse cx="90" cy="124" rx="6.5" ry="9" fill="#1b1b1b"/><circle cx="92" cy="120.5" r="2" fill="#fff"/><ellipse cx="126" cy="124" rx="6.5" ry="9" fill="#1b1b1b"/><circle cx="128" cy="120.5" r="2" fill="#fff"/></g><g class="sway" transform="rotate(-12 92 70)"><ellipse cx="92" cy="70" rx="58" ry="24.36" fill="#1b1b1b"/><ellipse cx="92" cy="66" rx="46.400000000000006" ry="13.92" fill="#2c2c2c"/><circle cx="71.7" cy="45.64" r="9" fill="#1b1b1b"/></g></g></g></svg>
