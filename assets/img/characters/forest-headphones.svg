<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200"><title>Forest Headphones</title><style>
.breathe{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 4.2s ease-in-out -2.4s infinite}
.blink{transform-box:fill-box;transform-origin:50% 50%;animation:blink 5s ease-in-out 2.8s infinite}
.sway{transform-box:fill-box;transform-origin:50% 0;animation:sway 3.6s ease-in-out -2s infinite}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.02,.975)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96.5%{transform:scaleY(.1)}}
@keyframes sway{0%,100%{rotate:-4deg}50%{rotate:4deg}}
@media (prefers-reduced-motion:reduce){.breathe,.blink,.sway{animation:none}}
</style><g class="breathe"><ellipse cx="100" cy="110" rx="70" ry="66" fill="#1f6b3b"/><ellipse cx="76" cy="76" rx="22" ry="13" fill="#fff" opacity=".22"/><path d="M68 104q10 8 20 0" fill="none" stroke="#1b1b1b" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><path d="M112 104q10 8 20 0" fill="none" stroke="#1b1b1b" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><path d="M86 126q14 10 28 0" fill="none" stroke="#1b1b1b" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><path d="M34 88C26 10, 174 10, 166 88" fill="none" stroke="#1b1b1b" stroke-width="11" stroke-linejoin="round" stroke-linecap="round"/><rect x="16" y="82" width="28" height="52" rx="12" fill="#1b1b1b"/><rect x="156" y="82" width="28" height="52" rx="12" fill="#1b1b1b"/><rect x="21" y="90" width="8" height="36" rx="4" fill="#3a3a3a"/><rect x="171" y="90" width="8" height="36" rx="4" fill="#3a3a3a"/></g></svg>
