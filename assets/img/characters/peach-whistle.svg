<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200"><title>Peach Whistle</title><style>
.breathe{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 4.2s ease-in-out -3.5999999999999996s infinite}
.blink{transform-box:fill-box;transform-origin:50% 50%;animation:blink 6s ease-in-out 2.0999999999999996s infinite}
.sway{transform-box:fill-box;transform-origin:50% 0;animation:sway 3.6s ease-in-out -0.5s infinite}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.02,.975)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96.5%{transform:scaleY(.1)}}
@keyframes sway{0%,100%{rotate:-4deg}50%{rotate:4deg}}
@media (prefers-reduced-motion:reduce){.breathe,.blink,.sway{animation:none}}
</style><g class="breathe"><path d="M100 34C128 72 166 100 166 134 166 168 136 180 100 180 64 180 34 168 34 134 34 100 72 72 100 34Z" fill="#f6ae8e" stroke="#f6ae8e" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="84" cy="92" rx="16" ry="12" fill="#fff" opacity=".22"/><g class="blink"><ellipse cx="83" cy="110" rx="6.5" ry="9" fill="#1b1b1b"/><circle cx="85" cy="106.5" r="2" fill="#fff"/><ellipse cx="117" cy="110" rx="6.5" ry="9" fill="#1b1b1b"/><circle cx="119" cy="106.5" r="2" fill="#fff"/></g><path d="M40 122q60 30 120 0" fill="none" stroke="#2b2b2b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><g class="sway"><path d="M100 136v8" stroke="#8d9198" stroke-width="3"/><rect x="88" y="144" width="24" height="30" rx="8" fill="#c3c7cd" stroke="#9a9fa6" stroke-width="2"/><rect x="95" y="158" width="10" height="5" rx="2" fill="#5d6168"/></g></g></svg>
