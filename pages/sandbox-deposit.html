<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex">
    <meta name="description" content="Real mode account: Daraja sandbox test balance and deposits.">
    <title>Real account — SmartProfit</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.3.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="../assets/js/theme.js"></script>
    <link href="../assets/css/tokens.css" rel="stylesheet">
    <link href="../assets/css/glassmorphism.css" rel="stylesheet">
    <link href="../assets/css/app-shell.css" rel="stylesheet">
    <link href="../assets/css/mode-tokens.css" rel="stylesheet">
    <link href="../assets/css/loader.css" rel="stylesheet">
    <link href="../assets/css/real-account.css" rel="stylesheet">
</head>

<body class="premium-theme app-shell" data-shell-surface="app" data-shell-active="" data-shell-mode="real-sandbox" data-mode="real" data-page-loader="Loading account">
    <script src="../assets/js/auth.js"></script>
    <script>requireAuth()</script>
    <script src="../assets/js/loader.js"></script>

    <div data-shell-header></div>

    <main class="real-main">
        <p class="real-status" data-sandbox-status role="status" aria-live="polite"></p>

        <section class="real-panel" data-sandbox-unavailable hidden>
            <p class="real-empty">Real mode is not open on this account yet.</p>
        </section>

        <div data-sandbox-available hidden>
            <section class="real-panel real-balance-panel" aria-labelledby="realBalanceLabel">
                <div>
                    <p class="real-label" id="realBalanceLabel">Test balance <span class="real-env">Daraja Sandbox · not tradable</span></p>
                    <p class="real-balance">$<span data-sandbox-balance>—</span></p>
                </div>
            </section>

            <section class="real-panel" aria-labelledby="realHistoryHeading">
                <h2 class="real-heading" id="realHistoryHeading">Deposits</h2>
                <div class="real-table-wrap">
                    <table class="real-table">
                        <thead><tr><th>Date</th><th>USD</th><th>KES</th><th>Status</th><th>Receipt</th></tr></thead>
                        <tbody data-sandbox-history><tr><td colspan="5">Loading…</td></tr></tbody>
                    </table>
                </div>
            </section>
        </div>
    </main>

    <div data-shell-footer></div>

    <script src="../assets/js/shell.js"></script>
    <script src="../assets/js/account-context.js"></script>
    <script src="../assets/js/account-keys.js"></script>
    <script src="../assets/js/account-switcher.js"></script>
    <script src="../assets/js/deposit-sheet.js"></script>
    <script src="../assets/js/notifications.js"></script>
    <script src="../assets/js/sandbox-deposit.js"></script>
</body>

</html>
