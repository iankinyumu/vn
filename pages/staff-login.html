 <!-- smartprofitbinary-frontend/pages/staff-login.html -->
<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="SmartProfitBinary - Staff sign in">
    <meta name="robots" content="noindex, nofollow">
    <title>Staff Sign In - SmartProfitBinary</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.3.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <script src="../assets/js/theme.js"></script>
    <link href="../assets/css/tokens.css" rel="stylesheet">
    <link href="../assets/css/glassmorphism.css" rel="stylesheet">
    <link href="../assets/css/login.css" rel="stylesheet">
    <link href="../assets/css/public-shell.css" rel="stylesheet">
    <style>
        .staff-title-icon { margin-inline-end: 10px; color: var(--label-2); font-size: .8em; }

        .staff-login-status {
            min-height: 20px;
            margin: 14px 0 0;
            color: var(--label-2);
            font-size: 13px;
            text-align: center;
        }

        .staff-login-status.is-error { color: var(--negative); }

        .staff-scope-note {
            margin: 20px 0 0;
            padding-top: 16px;
            border-top: 1px solid var(--separator);
            color: var(--label-2);
            font-size: var(--text-caption);
            line-height: 1.6;
            text-align: center;
        }
    </style>
</head>

<body class="premium-theme auth-shell">

    <div class="animated-bg">
        <div class="particle particle-1"></div>
        <div class="particle particle-2"></div>
        <div class="particle particle-3"></div>
        <div class="particle particle-4"></div>
        <div class="particle particle-5"></div>
        <div class="particle particle-6"></div>
    </div>

    <div class="back-home"><a href="index.html"><i class="fas fa-arrow-left"></i> Back to Home</a></div>

    <div class="auth-wrapper">
        <div class="auth-card">

            <h1 class="auth-title"><i class="fas fa-user-shield staff-title-icon" aria-hidden="true"></i>Staff Sign In</h1>
            <p class="auth-subtitle">Sign in with your staff account to open the operations console.</p>

            <form id="staffLoginForm" onsubmit="handleStaffLogin(event)">
                <div class="form-group">
                    <label for="email">Staff Email Address</label>
                    <i class="fas fa-envelope form-icon"></i>
                    <input type="email" id="email" class="form-input" placeholder="you@smartprofitbinary.com" required
                        autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <i class="fas fa-lock form-icon"></i>
                    <input type="password" id="password" class="form-input" placeholder="••••••••" required
                        autocomplete="current-password" minlength="8">
                </div>

                <button type="submit" class="btn-signin">Sign In to Console</button>
                <p id="staffLoginStatus" class="staff-login-status" role="status" aria-live="polite"></p>
            </form>

            <p class="staff-scope-note">
                Staff sessions are stored separately from customer sessions and are never shared between them.
                Customer accounts and password resets use the
                <a href="login.html" style="color: var(--label);">customer sign-in page</a>.
            </p>

        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/staff-auth.js"></script>
    <script src="../assets/js/staff-login.js"></script>

</body>

</html>
