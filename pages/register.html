<!-- smartprofitbinary-frontend/pages/register.html -->
<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <meta name="description" content="SmartProfitBinary - Create your trading account">
    <title>Create Account - SmartProfitBinary</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.3.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link href="../assets/css/glassmorphism.css" rel="stylesheet">
    <link href="../assets/css/register.css" rel="stylesheet">
    <link href="../assets/css/public-shell.css" rel="stylesheet">
</head>

<body class="premium-theme auth-shell">

    <div class="animated-bg">
        <div class="particle particle-1"></div>
        <div class="particle particle-2"></div>
        <div class="particle particle-3"></div>
        <div class="particle particle-4"></div>
        <div class="particle particle-5"></div>
        <div class="particle particle-6"></div>
    </div>

    <div class="back-home"><a href="index.html"><i class="fas fa-arrow-left"></i> Back to Home</a></div>

    <div class="auth-wrapper">
        <div class="auth-card">

            <div class="auth-logo"><i class="fas fa-user-plus"></i></div>
            <h2 class="auth-title">Create Account</h2>
            <p class="auth-subtitle">Start your trading journey with SmartProfitBinary today</p>

            <div class="step-indicator">
                <div class="step-dot active"></div>
                <div class="step-dot"></div>
                <div class="step-dot"></div>
            </div>

            <form id="registerForm" onsubmit="handleRegister(event)">
                <div class="form-row">
                    <div class="form-group">
                        <label for="firstName">First Name</label>
                        <div class="input-wrapper">
                            <i class="fas fa-user form-icon"></i>
                            <input type="text" id="firstName" class="form-input" placeholder="John" required
                                autocomplete="given-name">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="lastName">Last Name</label>
                        <div class="input-wrapper">
                            <i class="fas fa-user form-icon"></i>
                            <input type="text" id="lastName" class="form-input" placeholder="Doe" required
                                autocomplete="family-name">
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope form-icon"></i>
                        <input type="email" id="email" class="form-input" placeholder="your@email.com" required
                            autocomplete="email">
                    </div>
                </div>

                <div class="form-group">
                    <label for="username">Username</label>
                    <div class="input-wrapper">
                        <i class="fas fa-at form-icon"></i>
                        <input type="text" id="username" class="form-input" placeholder="johndoe" required
                            autocomplete="username" minlength="3">
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock form-icon"></i>
                        <input type="password" id="password" class="form-input" placeholder="••••••••" required
                            autocomplete="new-password" minlength="8" oninput="checkPasswordStrength()">
                    </div>
                    <div class="password-strength">
                        <div class="strength-bar" id="strengthBar"></div>
                    </div>
                    <p class="strength-text" id="strengthText">Min 8 characters</p>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-shield-halved form-icon"></i>
                        <input type="password" id="confirmPassword" class="form-input" placeholder="••••••••" required
                            autocomplete="new-password" minlength="8">
                    </div>
                    <p class="strength-text" id="matchText" style="display:none;color:#ef4444">Passwords do not match
                    </p>
                </div>

                <label class="terms-check">
                    <input type="checkbox" id="termsCheck" required>
                    <span>I agree to the <a href="#">Terms of Service</a>, <a href="#">Privacy Policy</a>, and <a
                            href="#">Risk Disclosure</a></span>
                </label>

                <button type="submit" class="btn-register" id="registerBtn">Create Account</button>
            </form>

            <div class="divider">or sign up with</div>

            <div class="social-btns">
                <button class="social-btn google" onclick="alert('Google sign up')"><i class="fab fa-google"></i>
                    Google</button>
                <button class="social-btn apple" onclick="alert('Apple sign up')"><i class="fab fa-apple"></i>
                    Apple</button>
                <button class="social-btn github" onclick="alert('GitHub sign up')"><i class="fab fa-github"></i>
                    GitHub</button>
            </div>

            <p class="auth-footer">Already have an account? <a href="login.html">Sign In</a></p>

        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/register.js"></script>
</body>

</html>
