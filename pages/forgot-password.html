<!-- smartprofitbinary-frontend/pages/forgot-password.html -->
<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <meta name="description" content="SmartProfitBinary - Reset your account password">
    <title>Forgot Password - SmartProfitBinary</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.3.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link href="../assets/css/glassmorphism.css" rel="stylesheet">
    <link href="../assets/css/auth.css" rel="stylesheet">
    <link href="../assets/css/public-shell.css" rel="stylesheet">
</head>

<body class="premium-theme auth-shell">

    <div class="animated-bg">
        <div class="particle particle-1"></div>
        <div class="particle particle-2"></div>
        <div class="particle particle-3"></div>
        <div class="particle particle-4"></div>
        <div class="particle particle-5"></div>
        <div class="particle particle-6"></div>
    </div>

    <div class="back-home"><a href="login.html"><i class="fas fa-arrow-left"></i> Back to Login</a></div>

    <div class="auth-wrapper">
        <div class="auth-card">

            <div id="formSection">
                <div class="auth-logo"><i class="fas fa-lock"></i></div>
                <h2 class="auth-title">Forgot Password</h2>
                <p class="auth-subtitle">Enter your email address and we'll send you a link to reset your password.</p>

                <div class="error-message" id="errorMsg"><i class="fas fa-exclamation-circle"></i><span
                        id="errorText"></span></div>

                <form id="forgotForm">
                    <div class="form-group mb-3">
                        <label class="form-label" for="email">Email Address</label>
                        <div class="input-wrapper">
                            <i class="fas fa-envelope form-icon"></i>
                            <input type="email" id="email" class="form-input" placeholder="your@email.com" required
                                autocomplete="email">
                        </div>
                    </div>

                    <button type="submit" class="btn-reset" id="resetBtn">
                        <span class="loading-spinner" id="spinner"></span> Send Reset Link
                    </button>
                </form>

                <p class="auth-footer">Remember your password? <a href="login.html">Sign In</a></p>
            </div>

            <div class="success-message" id="successMsg">
                <div class="success-icon"><i class="fas fa-check"></i></div>
                <h4>Check Your Email</h4>
                <p>We've sent a password reset link to <b id="sentEmail"></b>. The link will expire in 30 minutes.</p>
                <p class="success-hint">Didn't receive the email? Check spam folder or <a href="#" id="tryAgainLink">try
                        again</a>.</p>
            </div>

        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
        <script src="../assets/js/auth.js"></script>
</body>

</html>
