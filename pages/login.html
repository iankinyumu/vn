<!-- smartprofitbinary-frontend/pages/login.html -->
<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <meta name="description" content="SmartProfit - Sign in to your account">
    <title>Sign In - SmartProfit</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.3.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link href="../assets/css/glassmorphism.css" rel="stylesheet">
    <link href="../assets/css/login.css" rel="stylesheet">
    <link href="../assets/css/public-shell.css" rel="stylesheet">
</head>

<body class="premium-theme auth-shell">

    <div class="animated-bg">
        <div class="particle particle-1"></div>
        <div class="particle particle-2"></div>
        <div class="particle particle-3"></div>
        <div class="particle particle-4"></div>
        <div class="particle particle-5"></div>
        <div class="particle particle-6"></div>
    </div>

    <div class="back-home"><a href="index.html"><i class="fas fa-arrow-left"></i> Back to Home</a> · <a href="fairness.html">Fairness</a></div>

    <div class="auth-wrapper">
        <div class="auth-card">

            <h2 class="auth-title">Welcome Back</h2>
            <p class="auth-subtitle">Sign in to access your SmartProfit practice dashboard</p>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <i class="fas fa-envelope form-icon"></i>
                    <input type="email" id="email" class="form-input" placeholder="your@email.com" required
                        autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <i class="fas fa-lock form-icon"></i>
                    <input type="password" id="password" class="form-input" placeholder="••••••••" required
                        autocomplete="current-password" minlength="8">
                </div>

                <div class="remember-row">
                    <label class="remember-check"><input type="checkbox" id="rememberMe"> Remember me</label>
                    <a href="forgot-password.html" class="forgot-link">Forgot Password?</a>
                </div>

                <button type="submit" class="btn-signin">Sign In</button>
            </form>
            <p id="loginStatus" class="strength-text" role="status" aria-live="polite"
                style="font-size:13px;margin:12px 0 0;min-height:18px;text-align:center"></p>

            <p class="auth-footer">Don't have an account? <a href="register.html">Create Account</a></p>

        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/login.js"></script>

</body>

</html>
