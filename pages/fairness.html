<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Verify published SmartProfit digits against revealed epoch seeds and commitments.">
    <title>Fairness — SmartProfit</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0..1,0&amp;icon_names=account_circle,add,admin_panel_settings,alternate_email,area_chart,arrow_back,arrow_downward,arrow_forward,arrow_right_alt,arrow_upward,balance,bar_chart,block,bolt,calendar_month,campaign,cancel,casino,category,check,check_circle,chevron_left,chevron_right,circle,close,contrast,currency_exchange,dark_mode,difference,edit,equal,error,expand_more,format_list_numbered,graphic_eq,group,help,history,home,hourglass_top,inbox,info,key,keyboard_double_arrow_left,keyboard_double_arrow_right,layers,light_mode,list,lock,lock_open,login,logout,mail,menu,menu_book,mood,notifications,percent,person,person_off,pie_chart,qr_code,refresh,save,schedule,search,send,settings,shield,show_chart,smartphone,sort,speed,sports_score,star,support_agent,swap_horiz,table,tag,timer,tune,undo,upload,visibility,warning&amp;display=block" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="../assets/js/consent.js"></script><script src="../assets/js/theme.js"></script>
    <link href="../assets/css/tokens.css" rel="stylesheet">
    <link href="../assets/css/glassmorphism.css" rel="stylesheet">
    <link href="../assets/css/style.css" rel="stylesheet">
    <link href="../assets/css/app-shell.css" rel="stylesheet">
    <link href="../assets/css/mode-tokens.css" rel="stylesheet">
    <link href="../assets/css/loader.css" rel="stylesheet">
    <link href="../assets/css/fairness.css" rel="stylesheet">
</head>

<body class="premium-theme app-shell" data-shell-surface="app" data-shell-active="fairness" data-page-loader="Loading verifier">
    <script src="../assets/js/auth.js"></script>
    <script>requireAuth()</script>
    <script src="../assets/js/loader.js"></script>

    <div data-shell-header></div>

    <main class="fairness-main">
        <div class="fairness-intro">
            <img class="fairness-mascot" src="../assets/img/mascots/sage-diamond-camera.webp" width="88" height="88" alt="" aria-hidden="true" decoding="async">
            <h1>Verify fairness</h1>
            <p>Recompute published outcomes from revealed seeds.</p>
        </div>

        <section class="fairness-panel" aria-labelledby="fairness-form-heading">
            <div class="fairness-panel-heading">
                <div>
                    <h2 id="fairness-form-heading">Choose a tick range</h2>
                </div>
                <span class="fairness-range-note">Up to 5,000 ticks</span>
            </div>

            <form data-fairness-form>
                <div class="fairness-fields">
                    <label for="fairness-index">Index
                        <select id="fairness-index" name="index" class="form-select"></select>
                    </label>
                    <label for="fairness-from">First tick
                        <input id="fairness-from" name="from" type="number" min="1" class="form-control" required>
                    </label>
                    <label for="fairness-to">Last tick
                        <input id="fairness-to" name="to" type="number" min="1" class="form-control" required>
                    </label>
                </div>
                <button class="btn btn-premium-primary fairness-submit" type="submit">Verify range</button>
            </form>

            <div class="fairness-results">
                <p data-fairness-result role="status" aria-live="polite"></p>
                <ul data-fairness-epochs aria-label="Epoch verification results"></ul>
            </div>
        </section>

        <section class="fairness-panel" aria-labelledby="fairness-v3-heading" data-fairness-v3 hidden>
            <div class="fairness-panel-heading">
                <div>
                    <h2 id="fairness-v3-heading">Check signed, timestamped history</h2>
                </div>
                <span class="fairness-range-note">Up to 5,000 ticks</span>
            </div>
            <form>
                <div class="fairness-fields">
                    <label for="fairness-v3-index">Index
                        <select id="fairness-v3-index" name="index" class="form-select"></select>
                    </label>
                    <label for="fairness-v3-from">First tick
                        <input id="fairness-v3-from" name="from" type="number" min="1" class="form-control" required>
                    </label>
                    <label for="fairness-v3-to">Last tick
                        <input id="fairness-v3-to" name="to" type="number" min="1" class="form-control" required>
                    </label>
                </div>
                <button class="btn btn-premium-primary fairness-submit" type="submit">Verify range</button>
            </form>
            <p class="fairness-range-note" data-fairness-v3-note hidden></p>
            <div class="fairness-results">
                <p data-fairness-v3-result role="status" aria-live="polite"></p>
                <ul data-fairness-v3-lines aria-label="Version 3 verification results"></ul>
                <p class="fairness-eyebrow" id="fairness-v3-details-heading">What was checked</p>
                <ul data-fairness-v3-details aria-labelledby="fairness-v3-details-heading"></ul>
                <button class="btn btn-outline-light btn-sm" type="button" data-fairness-v3-download hidden>Download proof package</button>
            </div>
        </section>

        <p class="fairness-help">Past outcomes only: a seed cannot predict the next digit. <a href="guide-fairness.html">How verification works</a></p>
    </main>

    <div data-shell-footer></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous"></script>
    <script src="../assets/js/shell.js"></script>
    <script src="../assets/js/engine-notice.js"></script>
    <script src="../assets/js/account-context.js"></script>
    <script src="../assets/js/account-keys.js"></script>
    <script src="../assets/js/account-switcher.js"></script>
    <script src="../assets/js/deposit-sheet.js"></script>
    <script src="../assets/js/notifications.js"></script>
    <script src="../assets/js/restriction-banner.js"></script>
    <script src="../assets/js/fairness.js"></script>
    <script type="module" src="../assets/js/fairness-v3.js"></script>
</body>

</html>
