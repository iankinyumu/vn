<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Trade SmartProfit's self-generated digit indices.">
    <title>Trade — SmartProfit</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.3.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="../assets/js/theme.js"></script>
    <link href="../assets/css/tokens.css" rel="stylesheet">
    <link href="../assets/css/app-shell.css" rel="stylesheet">
    <link href="../assets/css/mode-tokens.css" rel="stylesheet">
    <link href="../assets/css/loader.css" rel="stylesheet">
    <link href="../assets/css/trade.css" rel="stylesheet">
</head>
<body class="app-shell trade-page" data-shell-surface="app" data-shell-active="trade">
    <script src="../assets/js/auth.js"></script>
    <script>requireAuth()</script>
    <script src="../assets/js/loader.js"></script>
    <div data-shell-header></div>
    <main class="trade-main">
        <form id="trade-form" class="trade-layout" data-trade-form novalidate>
            <fieldset class="trade-families" data-families>
                <legend class="visually-hidden">Contract</legend>
            </fieldset>

            <section class="trade-market" aria-label="Market">
                <div class="market-bar">
                    <label class="index-picker"><span class="visually-hidden">Index</span><select name="index" data-index-select></select></label>
                    <div class="market-price">
                        <strong data-live-price aria-label="Live price">—</strong>
                        <small class="price-direction" data-price-direction data-direction="flat"></small>
                    </div>
                    <div class="chart-controls">
                        <div class="chart-style" role="radiogroup" aria-label="Chart type" data-chart-style>
                            <label class="chart-choice" title="Line"><input type="radio" name="chartStyle" value="line" checked><span><i class="fas fa-chart-line" aria-hidden="true"></i><span class="chart-choice-text">Line</span></span></label>
                            <label class="chart-choice" title="Candles"><input type="radio" name="chartStyle" value="candles"><span><i class="fas fa-chart-column" aria-hidden="true"></i><span class="chart-choice-text">Candles</span></span></label>
                            <label class="chart-choice" title="OHLC bars"><input type="radio" name="chartStyle" value="ohlc"><span><i class="fas fa-bars-staggered" aria-hidden="true"></i><span class="chart-choice-text">OHLC</span></span></label>
                        </div>
                        <label class="chart-period" data-chart-period-wrap hidden><span class="visually-hidden">Candle period</span><select name="chartPeriod" data-chart-period><option value="10000">10s</option><option value="30000" selected>30s</option><option value="60000">1m</option></select></label>
                    </div>
                    <span class="feed-state" data-feed-state data-state="loading" aria-live="polite">Loading</span>
                </div>
                <div class="chart-frame">
                    <canvas class="index-chart" data-index-chart aria-label="Recent index prices" role="img"></canvas>
                    <span class="market-active" data-active-trade hidden></span>
                </div>
                <div class="digit-strip" role="group" aria-label="Last digit" aria-describedby="current-digit" data-digits>
                    <span class="digit-pointer" data-digit-pointer aria-hidden="true" hidden></span>
                </div>
                <p id="current-digit" class="visually-hidden" data-current-digit>No digit yet</p>
            </section>

            <section class="trade-ticket" aria-label="Trade">
                <p class="ticket-mode">Account <strong><span class="ticket-mode-practice">Practice</span><span class="ticket-mode-real">Real</span></strong></p>
                <div class="ticket-row barrier-row" data-barrier-row hidden>
                    <span class="ticket-label" id="barrier-label">Digit</span>
                    <div class="barrier-picker" role="radiogroup" aria-labelledby="barrier-label" data-barrier-picker></div>
                </div>

                <div class="ticket-row">
                    <label class="ticket-label" for="trade-stake">Stake</label>
                    <div class="stake-control">
                        <button type="button" class="stake-step" data-stake-step="-1" aria-label="Decrease stake">−</button>
                        <div class="stake-field"><span aria-hidden="true">$</span><input id="trade-stake" name="stake" type="number" inputmode="decimal" step="0.01" min="1" value="1.00" required></div>
                        <button type="button" class="stake-step" data-stake-step="1" aria-label="Increase stake">+</button>
                    </div>
                </div>

                <div class="ticket-row">
                    <span class="ticket-label" id="ticks-label">Ticks</span>
                    <div class="tick-chips" role="radiogroup" aria-labelledby="ticks-label" data-tick-chips></div>
                </div>

                <div class="ticket-row session-row">
                    <div class="session-stats"><span class="ticket-label">Session</span><strong data-session-net>$0.00</strong><small data-session-count>0W · 0L</small></div>
                    <label class="session-limit"><span class="ticket-label">Take profit</span><input name="takeProfit" type="number" inputmode="decimal" min="0" step="0.01" placeholder="Off" data-take-profit></label>
                    <label class="session-limit"><span class="ticket-label">Stop loss</span><input name="stopLoss" type="number" inputmode="decimal" min="0" step="0.01" placeholder="Off" data-stop-loss></label>
                </div>

                <p class="trade-gate" data-session-guard role="status" hidden><span data-session-guard-text></span> <button type="button" class="trade-gate-action" data-session-resume>Start new session</button></p>
                <p class="trade-status" data-trade-status role="status" aria-live="polite"></p>

                <div class="trade-actions" data-trade-actions>
                    <button type="button" class="trade-side trade-side-a" data-side="a" disabled><span class="side-name"><i aria-hidden="true"></i><span data-side-label>—</span></span><span class="side-payout"><strong data-side-payout>—</strong><small>Payout</small></span></button>
                    <button type="button" class="trade-side trade-side-b" data-side="b" disabled><span class="side-name"><i aria-hidden="true"></i><span data-side-label>—</span></span><span class="side-payout"><strong data-side-payout>—</strong><small>Payout</small></span></button>
                </div>
            </section>
        </form>

        <section class="trade-activity" aria-label="Your trades">
            <div class="activity-tabs" role="tablist" aria-label="Your trades">
                <button type="button" role="tab" id="tab-open" aria-controls="panel-open" aria-selected="true" data-activity-tab="open">Open <span data-open-count>0</span></button>
                <button type="button" role="tab" id="tab-settled" aria-controls="panel-settled" aria-selected="false" tabindex="-1" data-activity-tab="settled">History</button>
            </div>
            <ul class="activity-list" id="panel-open" role="tabpanel" aria-labelledby="tab-open" data-open-contracts></ul>
            <ul class="activity-list" id="panel-settled" role="tabpanel" aria-labelledby="tab-settled" data-settled-contracts hidden></ul>
        </section>
    </main>
    <div class="app-toast-stack" data-toasts data-trade-toasts aria-label="Notifications"></div>
    <script src="../assets/js/shell.js"></script>
    <script src="../assets/js/engine-notice.js"></script>
    <script src="../assets/js/account-context.js"></script>
    <script src="../assets/js/account-keys.js"></script>
    <script src="../assets/js/account-switcher.js"></script>
    <script src="../assets/js/deposit-sheet.js"></script>
    <script src="../assets/js/notifications.js"></script>
    <script src="../assets/js/restriction-banner.js"></script>
    <script src="../assets/js/charts.js"></script>
    <script src="../assets/js/trade.js"></script>
    <script src="../assets/js/avatars.js"></script>
    <script src="../assets/js/trade-companion.js"></script>
</body>
</html>
