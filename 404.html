<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <meta name="description" content="Page not found - SmartProfitBinary">
    <title>404 - Page Not Found | SmartProfitBinary</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.3.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link href="../assets/css/glassmorphism.css" rel="stylesheet">
    <link href="../assets/css/style.css" rel="stylesheet">
    <link href="../assets/css/404.css" rel="stylesheet">
</head>

<body class="premium-theme">

    <div class="animated-bg">
        <div class="particle particle-1"></div>
        <div class="particle particle-2"></div>
        <div class="particle particle-3"></div>
        <div class="particle particle-4"></div>
        <div class="particle particle-5"></div>
        <div class="particle particle-6"></div>
    </div>

    <div class="error-wrapper">
        <div class="error-content">

            <div class="error-illustration">
                <div class="error-circle">
                    <span class="error-digit">4</span>
                    <div class="error-coin">
                        <i class="fab fa-bitcoin"></i>
                    </div>
                    <span class="error-digit">4</span>
                </div>
                <div class="error-shadow"></div>
            </div>

            <div class="error-card">
                <div class="error-icon-wrapper">
                    <i class="fas fa-exclamation-triangle"></i>
                </div>
                <h1 class="error-title">Page Not Found</h1>
                <p class="error-message">Oops! The page you're looking for doesn't exist or has been moved to another
                    location.</p>
                <div class="error-divider"></div>
                <div class="error-suggestions">
                    <h6><i class="fas fa-lightbulb me-2"></i>Here are some helpful links:</h6>
                    <div class="error-links">
                        <a href="index.html" class="error-link"><i class="fas fa-home"></i> Home</a>
                        <a href="about.html" class="error-link"><i class="fas fa-info-circle"></i> About</a>
                        <a href="blog.html" class="error-link"><i class="fas fa-newspaper"></i> Blog</a>
                        <a href="faq.html" class="error-link"><i class="fas fa-question-circle"></i> FAQ</a>
                        <a href="contact.html" class="error-link"><i class="fas fa-headset"></i> Support</a>
                    </div>
                </div>
                <div class="error-actions">
                    <a href="index.html" class="btn btn-premium-primary btn-lg">
                        <i class="fas fa-home me-2"></i> Back to Homepage
                    </a>
                    <button class="btn btn-glass-premium btn-lg" onclick="history.back()">
                        <i class="fas fa-arrow-left me-2"></i> Go Back
                    </button>
                </div>
            </div>

            <div class="error-search">
                <p>Or try searching for what you need:</p>
                <div class="search-wrapper error-search-wrapper">
                    <i class="fas fa-search search-icon"></i>
                    <input type="search" class="premium-search" placeholder="Search...">
                    <button class="btn btn-premium-primary btn-sm">Search</button>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
</body>

</html>
